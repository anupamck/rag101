version: "3.8"
services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag101:latest
    container_name: rag101-jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
    environment:
      - PYTHONUNBUFFERED=1
      - PIP_NO_CACHE_DIR=1
      # Pass through local env vars if set
      - OPENAI_API_KEY
      - LANGCHAIN_API_KEY
      - LANGSMITH_API_KEY
      - LANGSMITH_TRACING=true
    command: [ "jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--ServerApp.token=", "--ServerApp.password=" ]
